minimumReleaseAgeExclude:
  - bumpp@12.1.0
  - '@types/node@26.1.2'
  - postcss@8.5.24

shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - packages/*
  - '!playgrounds'

overrides:
  chokidar: ^5.0.0
  semver: ^7.8.5
  # 7.4.1 swaps @surma/rollup-plugin-off-main-thread for the @trickfilm400 fork,
  # whose 3.0.0-pre1 has no provenance attestation and trips trustPolicy.
  workbox-build: 7.4.0

patchedDependencies:
  google-font-installer@1.2.0: patches/google-font-installer@1.2.0.patch

