minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - bumpp@12.3.0

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
sideEffectsCache: false

packages:
  - packages/*
  - '!playgrounds'

overrides:
  chokidar: ^6.0.0
  semver: ^7.8.6
  # 7.4.1 swaps @surma/rollup-plugin-off-main-thread for the @trickfilm400 fork,
  # whose 3.0.0-pre1 has no provenance attestation and trips trustPolicy.
  workbox-build: 7.4.0

patchedDependencies:
  google-font-installer@1.2.0: patches/google-font-installer@1.2.0.patch

allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': false
  electron: false
  esbuild: false
  msw: false
  pnpm: false
  protobufjs: false
  simple-git-hooks: false

