minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@iconify/json@2.2.525'
  - vue-router@5.3.1
  - bumpp@12.3.0

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
sideEffectsCache: false

packages:
  - packages/*
  - '!playgrounds'

overrides:
  chokidar: ^5.0.0
  semver: ^7.8.5
  # 7.4.1 swaps @surma/rollup-plugin-off-main-thread for the @trickfilm400 fork,
  # whose 3.0.0-pre1 has no provenance attestation and trips trustPolicy.
  workbox-build: 7.4.0

patchedDependencies:
  google-font-installer@1.2.0: patches/google-font-installer@1.2.0.patch

allowBuilds:
  '@firebase/util': false
  '@parcel/watcher': false
  electron: false
  esbuild: false
  msw: false
  protobufjs: false
  simple-git-hooks: false

